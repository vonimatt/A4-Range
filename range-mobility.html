<style>
/* Layout: App-Shell wie ein Box-Whiteboard. Inhalte in einer Spalte, Bibliothek als Raster, Tab-Leiste unten. Farbcode der Körperzonen = Bumper-Plate-Farben. */
:root {
  --bg: #E9ECEE;
  --surface: #FFFFFF;
  --surface-2: #F4F6F7;
  --ink: #14171A;
  --muted: #5B636B;
  --line: #D3D8DC;
  --accent: #D3242C;
  --accent-ink: #FFFFFF;
  --plate-blue: #1E5BB8;
  --plate-red: #D3242C;
  --plate-yellow: #D9A307;
  --plate-green: #2B8546;
  --hub: #C9CED3;
  --shadow: 0 1px 2px rgba(20,23,26,.06), 0 6px 18px rgba(20,23,26,.06);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101214; --surface: #191C1F; --surface-2: #202428; --ink: #F1F3F4; --muted: #9BA3AB;
    --line: #2B3035; --accent: #FF4950; --accent-ink: #14171A;
    --plate-blue: #4C8DF0; --plate-red: #FF4950; --plate-yellow: #F2C230; --plate-green: #45B56A;
    --hub: #3A4046; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101214; --surface: #191C1F; --surface-2: #202428; --ink: #F1F3F4; --muted: #9BA3AB;
  --line: #2B3035; --accent: #FF4950; --accent-ink: #14171A;
  --plate-blue: #4C8DF0; --plate-red: #FF4950; --plate-yellow: #F2C230; --plate-green: #45B56A;
  --hub: #3A4046; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--plate-blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .01em; line-height: 1; margin: 0; text-wrap: balance; }
.app { max-width: 980px; margin: 0 auto; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font-size: 28px; font-weight: 900; white-space: nowrap; }
.brand small { display: block; font-family: var(--f-body); font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; font-weight: 600; margin-top: 2px; }
.hdr-right { display: grid; gap: 8px; justify-items: end; }
.seg.lang { border-radius: 8px; }
.seg.lang button { padding: 3px 10px; font-size: 12px; }
.streak { display: flex; gap: 4px; align-items: center; }
.streak span { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--muted); border: 1.5px solid var(--line); }
.streak span.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.streak span.today { border-color: var(--ink); color: var(--ink); }

section.view { display: grid; gap: 28px; padding-top: 12px; }
section.view > * { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 0 0 6px; }
.h-xl { font-size: clamp(38px, 9vw, 64px); font-weight: 900; }
.h-l { font-size: 30px; font-weight: 800; }
.h-m { font-size: 22px; font-weight: 800; }
.lead { color: var(--muted); max-width: 60ch; margin: 8px 0 0; }
.small { font-size: 14px; color: var(--muted); margin: 0; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* Whiteboard (Generator) */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 18px; box-shadow: var(--shadow); }
.board > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.sport-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.sport-tabs button { flex: none; border: 0; background: var(--surface-2); border-radius: 8px; padding: 8px 14px; font-family: var(--f-display); font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); }
.sport-tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; font-family: var(--f-mono); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Sequenz-Liste */
.seq { list-style: none; margin: 0; padding: 0; display: grid; }
.seq li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.seq li.phase-head { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--muted); padding: 14px 0 2px; border-top: 0; }
.seq li.phase-head + li { border-top: 0; }
.seq .exbtn { border: 0; background: none; padding: 0; font-weight: 600; text-align: left; }
.seq .meta { font-size: 13px; color: var(--muted); }
.seq .meta em { font-style: normal; color: var(--plate-green); font-weight: 600; }
.seq .t { font-family: var(--f-mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Bumper-Plate-Icon */
.plate { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, var(--hub) 0 22%, var(--c, var(--plate-red)) 23% 100%); flex: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); display: inline-block; }
.c-blue { --c: var(--plate-blue); } .c-red { --c: var(--plate-red); } .c-yellow { --c: var(--plate-yellow); } .c-green { --c: var(--plate-green); }

.btn { border: 0; border-radius: 12px; padding: 13px 20px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; justify-content: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; border: 1.5px solid var(--line); }
.btn-dark { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.total { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Karten */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; text-align: left; align-content: start; min-width: 0; }
button.card:hover { border-color: var(--muted); }
.card .stack { display: flex; }
.card .stack .plate { width: 24px; height: 24px; margin-left: -6px; border: 2px solid var(--surface); }
.card .stack .plate:first-child { margin-left: 0; }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-weight: 600; }
.kv b { font-family: var(--f-mono); color: var(--ink); font-weight: 700; }
.tag-rec { justify-self: start; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; }
.group-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 14px; }
.group-head h3 { font-size: 26px; font-weight: 900; }
.group-head span { color: var(--muted); font-size: 14px; }

/* Bibliothek */
.filters { display: grid; gap: 12px; }
.filters > * { min-width: 0; }
.search { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font: inherit; color: var(--ink); }
.scroll-x { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.scroll-x .chip { flex: none; }
.lib { grid-template-columns: repeat(auto-fill, minmax(min(100%, 158px), 1fr)); gap: 10px; }
.ex-card { padding: 10px 12px 14px; gap: 6px; }
.ex-card .ill { width: 100%; height: 84px; }
.ex-card h3 { font-family: var(--f-body); text-transform: none; font-size: 15px; font-weight: 700; letter-spacing: 0; line-height: 1.25; }
.ex-card .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ex-card .meta .plate { width: 12px; height: 12px; }
.ex-card.missing { opacity: .55; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; background: var(--surface-2); border-radius: 6px; padding: 2px 8px; color: var(--muted); }
.tag.warn { background: var(--accent); color: var(--accent-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .plate { width: 14px; height: 14px; }
.count { font-size: 14px; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; }

/* Illustrationen */
.ill { display: block; overflow: visible; }
.ill .fig { stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.ill .far { stroke: var(--muted); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: .65; }
.ill .headc { fill: var(--ink); }
.ill .floor { stroke: var(--line); stroke-width: 2; }
.ill .roller { fill: var(--plate-blue); }
.ill .ball { fill: var(--plate-yellow); }
.ill .band { stroke: var(--plate-green); stroke-width: 2.5; stroke-dasharray: 4 3; fill: none; }
.ill .anchor { fill: var(--plate-green); }
.ill .pvc { stroke: var(--plate-red); stroke-width: 3.5; stroke-linecap: round; }
.ill .pvcdot { fill: var(--plate-red); }
.ill .kb { fill: var(--ink); }
.ill .kbh { stroke: var(--ink); stroke-width: 2; fill: none; }
.ill .box { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1.5; }
.ill .wall { stroke: var(--muted); stroke-width: 3; }
.ill .bar { stroke: var(--muted); stroke-width: 4; stroke-linecap: round; }
.ill .mot { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; }
.ill .chev { stroke: var(--muted); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.anim .fB { opacity: 0; }
@media (prefers-reduced-motion: no-preference) {
  .anim.two .fA { animation: swapA 3.2s infinite ease-in-out; }
  .anim.two .fB { animation: swapB 3.2s infinite ease-in-out; }
}
@keyframes swapA { 0%, 40% { opacity: 1 } 50%, 90% { opacity: 0 } 100% { opacity: 1 } }
@keyframes swapB { 0%, 40% { opacity: 0 } 50%, 90% { opacity: 1 } 100% { opacity: 0 } }
.ill-lg { width: 100%; aspect-ratio: 250 / 110; max-width: 100%; background: var(--surface); border-radius: 12px; padding: 10px; }
.ill-lg .ill { width: 100%; height: 100%; }

/* Check */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; margin: 0; min-width: 0; }
.q h3 { font-family: var(--f-body); text-transform: none; font-size: 18px; font-weight: 700; letter-spacing: 0; }
.q p { margin: 0; color: var(--muted); font-size: 15px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--ink); background: var(--surface-2); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.score-num { font-family: var(--f-display); font-size: 88px; font-weight: 900; line-height: .9; }
.score-num small { font-size: 28px; color: var(--muted); }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { display: block; height: 100%; background: var(--ink); border-radius: 5px; }
.bar .fill.low { background: var(--accent); }
.bar .v { font-family: var(--f-mono); font-size: 13px; text-align: right; }
@media (max-width: 420px) { .score { grid-template-columns: 1fr; } }

/* Profil */
.pf { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.pf h3 { font-size: 22px; font-weight: 800; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; }
.hist li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.hist li:first-child { border-top: 0; }
.hist .d { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.stats { display: flex; gap: 28px; }
.stats b { display: block; font-family: var(--f-display); font-size: 40px; font-weight: 900; line-height: 1; }
.stats span { font-size: 13px; color: var(--muted); font-weight: 600; }

/* Tab-Leiste */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.tabs button { border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; min-width: 0; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

/* Sheet / Detail */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,14,.55); display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
.sheet > * { min-width: 0; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.cue { background: var(--surface); border-radius: 10px; padding: 12px 14px; font-weight: 600; display: flex; gap: 10px; }
.cue::before { content: "Coach-Cue"; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; white-space: nowrap; padding-top: 3px; }
.close { justify-self: end; border: 0; background: var(--surface); width: 38px; height: 38px; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }

/* Player */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; overflow-y: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.p-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; max-width: 620px; width: 100%; margin: 0 auto; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.segs i.on { background: var(--ink); }
.segs i.cur { background: var(--accent); }
.p-pos { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.p-main { max-width: 620px; width: 100%; margin: 0 auto; display: grid; gap: 14px; align-content: center; padding-block: 12px; }
.p-main > * { min-width: 0; }
.p-ill { background: var(--surface); border-radius: 14px; padding: 10px; display: grid; place-items: center; }
.p-ill .ill { width: 100%; height: min(32vh, 280px); }
.p-name { font-size: clamp(28px, 7vw, 44px); font-weight: 900; }
.side { display: inline-block; font-family: var(--f-body); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 3px 9px; vertical-align: middle; }
.timer { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.timer .cue { flex-direction: column; gap: 2px; }
.timer .cue::before { padding-top: 0; }
.ring { width: 120px; height: 120px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.state { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.next { font-size: 14px; color: var(--muted); }
.p-ctrl { max-width: 620px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 10px; }
.done-wrap { text-align: center; display: grid; gap: 14px; justify-items: center; }
@media (prefers-reduced-motion: no-preference) {
  .ring circle.prog { transition: stroke-dashoffset .25s linear; }
}
</style>

const illCache = {};
function illus(e, mode) {
  const spec = ILL[e.id];
  if (!spec) return "";
  const key = e.id + mode + state.lang;
  if (illCache[key]) return illCache[key];
  let svg;
  if (mode === "anim") {
    svg = `<svg class="ill anim ${spec.length > 1 ? "two" : ""}" viewBox="0 0 120 110" aria-hidden="true">${frame(spec[0], "fA")}${spec[1] ? frame(spec[1], "fB") : ""}</svg>`;
  } else if (spec.length === 1) {
    svg = `<svg class="ill" viewBox="0 0 120 110" role="img" aria-label="${esc(t("ill", { x: exName(e) }))}">${frame(spec[0], "fA")}</svg>`;
  } else {
    svg = `<svg class="ill" viewBox="0 0 250 110" role="img" aria-label="${esc(t("ill_pair", { x: exName(e) }))}">${frame(spec[0], "fA")}<g transform="translate(130 0)">${frame(spec[1], "fB2")}</g><path class="chev" d="M121 49 l5 6 -5 6"/></svg>`;
  }
  return (illCache[key] = svg);
}

// Routine an die Ausrüstung anpassen: fehlende Übungen durch Alternativen ersetzen oder weglassen
function resolveRoutine(r) {
  const out = [], seen = new Set(); let dropped = 0;
  for (const id of r.ex) {
    const e = EXM[id];
    let use = avail(e) ? e : (e.alt && avail(EXM[e.alt]) ? EXM[e.alt] : null);
    if (!use) { dropped++; continue; }
    if (seen.has(use.id)) continue;
    seen.add(use.id);
    out.push({ e: use, replaced: use === e ? null : e });
  }
  out.sort((a, b) => a.e.phase - b.e.phase);
  return { items: out, dropped, replaced: out.filter(x => x.replaced).length };
}

function buildWod(sport, minutes) {
  const moves = new Set(state.moves[sport] || []);
  const target = minutes * 60;
  const scored = EX.filter(avail).map(e => ({ e, s: e.helps.filter(m => moves.has(m)).length }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || exSecs(a.e) - exSecs(b.e));
  const out = [], perRegion = {};
  let total = 0;
  for (const { e } of scored) {
    if (total >= target) break;
    const r = e.regions[0];
    if ((perRegion[r] || 0) >= 2) continue;
    perRegion[r] = (perRegion[r] || 0) + 1;
    out.push(e); total += exSecs(e);
  }
  return out.sort((a, b) => a.phase - b.phase);
}

    <div>
      <p class="eyebrow">${esc(t("check_eyebrow"))}</p>
      <h2 class="h-xl">${esc(t("check_h"))}</h2>
      <p class="lead">${esc(t("check_lead", { n: tests.length }))}</p>
    </div>
    ${result}
    <div class="filters">
      ${tests.map((c0, i) => { const c = checkT(c0); return `<fieldset class="q">
        <legend class="eyebrow" style="padding:0">${esc(t("test_n", { i: i + 1, n: tests.length }))} · ${esc(c.area)}</legend>
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.how)}</p>
        <div class="opts">${c.opts.map((o, j) => `<label class="opt"><input type="radio" name="q-${c.id}" id="q-${c.id}-${j}" value="${j}" ${a[c.id] === j ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>
      </fieldset>`; }).join("")}
      <button class="btn btn-primary" id="eval" ${complete ? "" : "disabled"}>${esc(r ? t("reevaluate") : t("evaluate"))}</button>
    </div>`;
  document.querySelectorAll('#v-check input[type="radio"]').forEach(inp => inp.onchange = () => {
    state.checkAnswers[inp.name.slice(2)] = +inp.value;
    store.set("checkAnswers", state.checkAnswers);
    $("#eval").disabled = !checkTests().every(c => state.checkAnswers[c.id] != null);
  });
  $("#eval").onclick = () => {
    const areas = {};
    checkTests().forEach(c => areas[c.id] = [20, 60, 100][state.checkAnswers[c.id]]);
    const ids = Object.keys(areas);
    const score = Math.round(ids.reduce((s, k) => s + areas[k], 0) / ids.length);
    const weakest = ids.sort((x, y) => areas[x] - areas[y])[0];
    state.checkResult = { score, areas, weakest, ts: Date.now() };
    store.set("checkResult", state.checkResult);
    renderCheck(); window.scrollTo({ top: 0, behavior: "smooth" });
  };
}

function renderProfile() {
  const h = state.history;
  const totalMin = Math.round(h.reduce((s, x) => s + x.s, 0) / 60);
  $("#v-profil").innerHTML = `
    <div>
      <p class="eyebrow">${esc(t("profile"))}</p>
      <h2 class="h-xl">${esc(t("profile_h"))}</h2>
      <p class="lead">${esc(t("profile_lead"))}</p>
    </div>
    <div class="pf">
      <h3>${esc(t("language"))}</h3>
      <div class="seg" role="group" aria-label="${esc(t("language"))}" style="justify-self:start">
        <button data-lang="de" aria-pressed="${state.lang === "de"}">Deutsch</button><button data-lang="en" aria-pressed="${state.lang === "en"}">English</button>
      </div>
    </div>
    <div class="pf">
      <h3>${esc(t("my_sports"))}</h3>
      <div class="chips" role="group" aria-label="${esc(t("my_sports"))}">
        ${Object.entries(SPORTS).map(([k, s]) => `<button class="chip" data-psport="${k}" aria-pressed="${state.sports.includes(k)}">${esc(s.name)}</button>`).join("")}
      </div>
      <p class="small" id="sport-msg">${esc(t("sports_hint"))}</p>
    </div>
    <div class="pf">
      <h3>${esc(t("my_equip"))}</h3>
      <div class="chips" role="group" aria-label="${esc(t("my_equip"))}">
        ${EQUIP.map(q => `<button class="chip" data-pequip="${esc(q)}" aria-pressed="${state.equip.has(q)}">${esc(eqLabel(q))}</button>`).join("")}
      </div>
      <p class="small">${esc(t("equip_hint", { a: EX.filter(avail).length, b: EX.length }))}</p>
      <div class="row" style="justify-content:flex-start">
        <button class="btn btn-ghost" data-equipall="1">${esc(t("select_all"))}</button>
        <button class="btn btn-ghost" data-equipall="0">${esc(t("no_equip_only"))}</button>
      </div>
    </div>
    <div class="pf">
      <h3>${esc(t("history"))}</h3>
      <div class="stats"><div><b>${h.length}</b><span>${esc(t("sessions"))}</span></div><div><b>${totalMin}</b><span>${esc(t("minutes"))}</span></div></div>
      ${h.length ? `<ul class="hist">${h.slice(-6).reverse().map(x => `<li><span>${esc(x.rid ? rName(ROUTINES.find(r => r.id === x.rid)) : x.t)}</span><span class="d">${esc(x.d)} · ${fmt(x.s)}</span></li>`).join("")}</ul>` : `<p class="small">${esc(t("no_history"))}</p>`}
      <button class="btn btn-ghost" id="reset" style="justify-self:start">${esc(state.confirmReset ? t("reset_confirm") : t("reset"))}</button>
    </div>`;
  $("#reset").onclick = () => {
    if (!state.confirmReset) { state.confirmReset = true; return renderProfile(); }
    state.history = []; state.checkResult = null; state.checkAnswers = {}; state.confirmReset = false;
    store.del("history"); store.del("checkResult"); store.del("checkAnswers");
    renderStreak(); renderProfile();
  };
}

const TABS = ["training", "routinen", "bibliothek", "check", "profil"];
function render() {
  renderChrome();
  for (const tb of TABS) {
    $("#v-" + tb).hidden = tb !== state.tab;
    document.querySelector(`nav [data-tab="${tb}"]`).setAttribute("aria-current", tb === state.tab ? "page" : "false");
  }
  renderStreak();
  ({ training: renderTraining, routinen: renderRoutines, bibliothek: renderLibrary, check: renderCheck, profil: renderProfile })[state.tab]();
}

function go(tab) {
  state.tab = tab; state.confirmReset = false;
  try { history.replaceState(null, "", "#" + tab); } catch {}
  render(); window.scrollTo(0, 0);
}

function setLang(l) {
  if (l === state.lang) return;
  state.lang = l; store.set("lang", l);
  render();
  if (P) drawPlayer();
}

// ---------- Detail-Sheet ----------
let sheetFor = null;
function openSheet(html) {
  const root = $("#overlay-root");
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#ov").onclick = e => { if (e.target.id === "ov" || e.target.closest("[data-close]")) closeSheet(); };
  root.querySelector(".close")?.focus();
}
function closeSheet() { if (!P) $("#overlay-root").innerHTML = ""; sheetFor = null; }

function openExercise(id) {
  const e = EXM[id];
  sheetFor = ["ex", id];
  const bySport = {};
  for (const m of e.helps) (bySport[MOVE_SPORT[m]] ||= []).push(moveName(m));
  const two = (ILL[e.id] || []).length > 1;
  openSheet(`
    <button class="close" data-close aria-label="${esc(t("close"))}">×</button>
    <div class="ill-lg" style="${two ? "" : "aspect-ratio: 250 / 140"}">${illus(e, "pair")}</div>
    <div style="display:flex;gap:14px;align-items:center">${plate(e)}<div style="min-width:0"><p class="eyebrow" style="margin:0">${esc(phaseName(e.phase))} · ${esc(e.regions.map(regionName).join(" · "))}</p><h2 class="h-l">${esc(exName(e))}</h2></div></div>
    <div class="kv"><span><b>${fmt(e.dur)}</b>${e.sides ? " " + esc(t("per_side")) : ""}</span><span>${esc(eqLabel(e.equip))}</span>${avail(e) ? "" : `<span class="tag warn">${esc(t("equip_missing_tag"))}</span>`}</div>
    <ol class="steps">${exSteps(e).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <div class="cue">${esc(exCue(e))}</div>
    <div><p class="eyebrow">${esc(t("helps_with"))}</p><div style="display:grid;gap:6px">${Object.entries(bySport).map(([s, ms]) => `<div class="tags"><span class="tag" style="color:var(--ink)">${esc(SPORTS[s].name)}</span>${ms.map(m => `<span class="tag">${esc(m)}</span>`).join("")}</div>`).join("")}</div></div>
    ${e.alt && !avail(e) && avail(EXM[e.alt]) ? `<p class="small">${esc(t("without_x", { x: eqLabel(e.equip) }))} <button class="linkbtn" data-ex="${e.alt}">${esc(exName(EXM[e.alt]))}</button></p>` : ""}
    <button class="btn btn-dark" id="solo">${esc(t("start_single"))}</button>`);
  $("#solo").onclick = () => { closeSheet(); startPlayer([e], exName(e)); };
}

function openRoutine(id) {
  const r = ROUTINES.find(x => x.id === id);
  sheetFor = ["r", id];
  const res = resolveRoutine(r);
  const total = res.items.reduce((s, x) => s + exSecs(x.e), 0);
  openSheet(`
    <button class="close" data-close aria-label="${esc(t("close"))}">×</button>
    <div><p class="eyebrow">${esc(t("routine"))} · ${esc(r.sport ? SPORTS[r.sport].name : t("for_all"))} · ${mins(total)} min</p><h2 class="h-l">${esc(rName(r))}</h2><p class="lead">${esc(rDesc(r))}</p></div>
    ${seqList(res.items)}
    ${res.dropped ? `<p class="small">${esc(t(res.dropped > 1 ? "dropped_n" : "dropped_1", { n: res.dropped }))}</p>` : ""}
    <button class="btn btn-primary" id="go-r">${esc(t("start_routine"))}</button>`);
  $("#go-r").onclick = () => { closeSheet(); startPlayer(res.items.map(x => x.e), rName(r), r.id); };
}

// ---------- Player ----------
const PREP = 5;
let P = null;
let audio = null;
function beep(freq = 880, len = 0.12) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.18, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + len);
    o.start(); o.stop(audio.currentTime + len);
  } catch {}
}

function startPlayer(list, title, rid) {
  const queue = [];
  for (const e of list) {
    if (e.sides) { queue.push({ e, side: "L" }, { e, side: "R" }); }
    else queue.push({ e, side: null });
  }
  P = { queue, title, rid: rid || null, idx: 0, mode: "prep", left: PREP, running: true, last: performance.now(), total: list.reduce((s, e) => s + exSecs(e), 0), wake: null };
  try { navigator.wakeLock?.request("screen").then(w => { if (P) P.wake = w; }).catch(() => {}); } catch {}
  beep(660);
  drawPlayer();
  P.timer = setInterval(tick, 200);
}

function tick() {
  if (!P || !P.running || P.mode === "done") { if (P) P.last = performance.now(); return; }
  const now = performance.now();
  P.left -= (now - P.last) / 1000; P.last = now;
  if (P.left <= 3 && P.left > 0 && Math.ceil(P.left) !== P.lastBeep) { P.lastBeep = Math.ceil(P.left); if (P.mode === "work") beep(520, .08); }
  if (P.left <= 0) advance(1);
  else updateTimer();
}

function advance(dir) {
  if (dir > 0 && P.mode === "prep") { P.mode = "work"; P.left = P.queue[P.idx].e.dur; beep(990, .2); }
  else {
    const n = P.idx + dir;
    if (n >= P.queue.length) return finish();
    P.idx = Math.max(0, n);
    const prev = P.queue[P.idx - 1];
    const cur = P.queue[P.idx];
    // Seitenwechsel ohne lange Pause
    const sameEx = dir > 0 && prev && prev.e.id === cur.e.id;
    P.mode = "prep"; P.left = sameEx ? 3 : PREP;
    if (dir > 0) beep(660);
  }
  P.lastBeep = null;
  drawPlayer();
}

function finish() {
  clearInterval(P.timer);
  P.mode = "done";
  try { P.wake?.release(); } catch {}
  state.history.push({ d: isoDay(new Date()), t: P.title, rid: P.rid, s: P.total });
  store.set("history", state.history.slice(-200));
  beep(990, .3);
  drawPlayer();
}

function closePlayer() {
  if (!P) return;
  clearInterval(P.timer);
  try { P.wake?.release(); } catch {}
  P = null;
  $("#overlay-root").innerHTML = "";
  render();
}

const R = 52, CIRC = 2 * Math.PI * R;
function drawPlayer() {
  const root = $("#overlay-root");
  const title = P.rid ? rName(ROUTINES.find(r => r.id === P.rid)) : P.title;
  if (P.mode === "done") {
    root.innerHTML = `<div class="player"><div></div>
      <div class="p-main"><div class="done-wrap">
        <svg width="90" height="90" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--plate-green)"/><circle cx="17" cy="17" r="4.5" fill="var(--hub)"/></svg>
        <p class="eyebrow" style="margin:0">${esc(t("done"))}</p>
        <h2 class="h-xl">${esc(title)}</h2>
        <p class="lead">${esc(t("done_lead", { n: mins(P.total) }))}</p>
      </div></div>
      <div class="p-ctrl" style="grid-template-columns:1fr"><button class="btn btn-primary" id="p-close">${esc(t("finish"))}</button></div></div>`;
    $("#p-close").onclick = closePlayer;
    return;
  }
  const cur = P.queue[P.idx], nxt = P.queue[P.idx + 1];
  root.innerHTML = `<div class="player" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="p-top">
      <button class="close" id="p-x" aria-label="${esc(t("end_session"))}">×</button>
      <div class="segs">${P.queue.map((_, i) => `<i class="${i < P.idx ? "on" : i === P.idx ? "cur" : ""}"></i>`).join("")}</div>
      <span class="p-pos">${P.idx + 1}/${P.queue.length}</span>
    </div>
    <div class="p-main">
      <div class="p-ill">${illus(cur.e, "anim")}</div>
      <div>
        <p class="eyebrow" style="margin:0 0 6px">${esc(title)} · ${esc(phaseName(cur.e.phase))}</p>
        <h2 class="p-name">${esc(exName(cur.e))} ${cur.side ? `<span class="side">${esc(sideName(cur.side))}</span>` : ""}</h2>
      </div>
      <div class="timer">
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line)" stroke-width="8"/>
            <circle class="prog" id="p-prog" cx="60" cy="60" r="${R}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/>
          </svg>
          <div class="num" id="p-num">0:00</div>
        </div>
        <div style="display:grid;gap:8px;min-width:0">
          <span class="state" id="p-state"></span>
          <div class="cue">${esc(exCue(cur.e))}</div>
          <span class="next">${nxt ? esc(t("next", { x: exName(nxt.e) + (nxt.side ? " · " + sideName(nxt.side) : "") })) : esc(t("last"))}</span>
        </div>
      </div>
    </div>
    <div class="p-ctrl">
      <button class="btn btn-ghost" id="p-prev" aria-label="${esc(t("prev_aria"))}">${esc(t("back"))}</button>
      <button class="btn btn-dark" id="p-play">${esc(P.running ? t("pause") : t("resume"))}</button>
      <button class="btn btn-ghost" id="p-next" aria-label="${esc(t("skip_aria"))}">${esc(t("skip"))}</button>
    </div>
  </div>`;
  $("#p-x").onclick = closePlayer;
  $("#p-prev").onclick = () => advance(-1);
  $("#p-next").onclick = () => { P.mode = "work"; advance(1); };
  $("#p-play").onclick = () => { P.running = !P.running; P.last = performance.now(); $("#p-play").textContent = P.running ? t("pause") : t("resume"); updateTimer(); };
  updateTimer();
}

function updateTimer() {
  const cur = P.queue[P.idx];
  const full = P.mode === "prep" ? (P.left > 3 ? PREP : Math.max(P.left, 3)) : cur.e.dur;
  const frac = Math.max(0, P.left) / full;
  const prog = $("#p-prog"); if (!prog) return;
  prog.style.stroke = P.mode === "prep" ? "var(--muted)" : "var(--accent)";
  prog.setAttribute("stroke-dashoffset", String(CIRC * (1 - frac)));
  $("#p-num").textContent = P.mode === "prep" ? Math.ceil(P.left) : fmt(Math.ceil(P.left));
  $("#p-state").textContent = !P.running ? t("paused") : P.mode === "prep" ? t("get_ready") : t("go");
}

// ---------- Events ----------
document.addEventListener("click", ev => {
  const tg = ev.target.closest("button, [data-ex]");
  if (!tg) return;
  const d = tg.dataset;
  if (d.lang) {
    const reopen = sheetFor;
    setLang(d.lang);
    if (reopen && !P) reopen[0] === "ex" ? openExercise(reopen[1]) : openRoutine(reopen[1]);
    return;
  }
  if (d.tab) return go(d.tab);
  if (d.goto) { closeSheet(); return go(d.goto); }
  if (d.tsport) { state.trainSport = d.tsport; store.set("trainSport", d.tsport); return render(); }
  if (d.move) {
    const sp = state.trainSport, cur = new Set(state.moves[sp] || []);
    cur.has(d.move) ? cur.delete(d.move) : cur.add(d.move);
    state.moves[sp] = [...cur]; store.set("moves", state.moves); return renderTraining();
  }
  if (d.mins) { state.mins = +d.mins; store.set("mins", state.mins); return renderTraining(); }
  if (d.fsport !== undefined) { state.filter.sport = d.fsport || null; return renderLibrary(); }
  if (d.region !== undefined) { state.filter.region = d.region || null; return renderLibrary(); }
  if (d.equip !== undefined) { state.filter.equip = d.equip || null; return renderLibrary(); }
  if (d.psport) {
    const i = state.sports.indexOf(d.psport);
    if (i >= 0) {
      if (state.sports.length === 1) { $("#sport-msg").textContent = t("sports_min"); return; }
      state.sports.splice(i, 1);
    } else state.sports.push(d.psport);
    state.sports.sort((a, b) => Object.keys(SPORTS).indexOf(a) - Object.keys(SPORTS).indexOf(b));
    if (!state.sports.includes(state.trainSport)) state.trainSport = state.sports[0];
    store.set("sports", state.sports); store.set("trainSport", state.trainSport); return renderProfile();
  }
  if (d.pequip) {
    state.equip.has(d.pequip) ? state.equip.delete(d.pequip) : state.equip.add(d.pequip);
    store.set("equip", [...state.equip]); return renderProfile();
  }
  if (d.equipall) { state.equip = new Set(d.equipall === "1" ? EQUIP : []); store.set("equip", [...state.equip]); return renderProfile(); }
  if (d.routine) return openRoutine(d.routine);
  if (d.ex) return openExercise(d.ex);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { if (P) closePlayer(); else closeSheet(); }
  if (P && P.mode !== "done" && ev.key === " ") { ev.preventDefault(); $("#p-play")?.click(); }
});

const initial = (location.hash || "").slice(1);
if (TABS.includes(initial)) state.tab = initial;
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h !== state.tab && TABS.includes(h)) go(h);
});
render();
</script>
